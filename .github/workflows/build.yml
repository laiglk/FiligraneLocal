name: Vérification macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compiler l’application
    runs-on: macos-14

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Compiler et vérifier la signature
        env:
          FILIGRANE_NO_OPEN: "1"
        run: bash build.command

      - name: Préparer le ZIP
        run: ditto -c -k --sequesterRsrc --keepParent build/FiligraneLocal.app FiligraneLocal-v1.1.0-macOS.zip

      - name: Préparer le DMG
        run: |
          mkdir -p dmg-root
          cp -R build/FiligraneLocal.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create             -volname "Filigrane Local"             -srcfolder dmg-root             -ov             -format UDZO             FiligraneLocal-v1.1.0.dmg
          hdiutil verify FiligraneLocal-v1.1.0.dmg

      - name: Conserver les fichiers d’installation
        uses: actions/upload-artifact@v4
        with:
          name: FiligraneLocal-macOS
          path: |
            FiligraneLocal-v1.1.0.dmg
            FiligraneLocal-v1.1.0-macOS.zip
          retention-days: 14
